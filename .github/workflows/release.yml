name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: PdfPasswordRemover.exe
          # Oldest supported runner: a binary built against an older glibc
          # also runs on more recent Linux distributions
          - os: ubuntu-22.04
            asset: PdfPasswordRemover-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check that the tag matches the script version
        shell: bash
        run: |
          script_version=$(python PdfPasswordRemover.py --version | awk '{print $2}')
          if [ "v$script_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $script_version"
            exit 1
          fi

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --name PdfPasswordRemover PdfPasswordRemover.py
          if [ "$RUNNER_OS" = "Linux" ]; then
            mv dist/PdfPasswordRemover "dist/${{ matrix.asset }}"
          fi

      - name: Smoke test the executable
        shell: bash
        run: '"dist/${{ matrix.asset }}" --version'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | System | File |
            |---|---|
            | Windows | `PdfPasswordRemover.exe` |
            | Linux (x86_64) | `PdfPasswordRemover-linux` |

            On Linux, make the file executable after downloading it:

            ```bash
            chmod +x PdfPasswordRemover-linux
            ./PdfPasswordRemover-linux <source_directory> <destination_directory>
            ```

            No Python installation is needed for either version.
