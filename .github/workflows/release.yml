name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check that the tag matches the script version
        shell: bash
        run: |
          script_version=$(python PdfPasswordRemover.py --version | awk '{print $2}')
          if [ "v$script_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $script_version"
            exit 1
          fi

      - name: Build executable
        run: pyinstaller --onefile --name PdfPasswordRemover PdfPasswordRemover.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PdfPasswordRemover.exe
          generate_release_notes: true
